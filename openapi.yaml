openapi: 3.1.0
info:
  title: AI Gateway API
  version: 0.1.0
  description: OpenAI Chat Completions compatible gateway MVP.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/models:
    get:
      summary: List models allowed for the calling client
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        object: { const: model }
                        owned_by: { type: string }
                      required: [id, object, owned_by]
                required: [object, data]
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/chat/completions:
    post:
      summary: Create a chat completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: Model alias configured by the gateway operator.
                messages:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                stream:
                  type: boolean
                  default: false
              required: [model, messages]
              additionalProperties: true
      responses:
        '200':
          description: Completion response or Server-Sent Events when stream is true.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        '400': { $ref: '#/components/responses/GatewayError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GatewayError' }
        '413': { $ref: '#/components/responses/GatewayError' }
        '429': { $ref: '#/components/responses/GatewayError' }
        '502': { $ref: '#/components/responses/GatewayError' }
        '503': { $ref: '#/components/responses/GatewayError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid gateway key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    GatewayError:
      description: Gateway rejected the request or no upstream completed it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string }
          required: [message, type, code]
      required: [error]
