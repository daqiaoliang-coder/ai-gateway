apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      containers:
        - name: ai-gateway
          image: ghcr.io/daqiaoliang-coder/ai-gateway:latest
          args: ["-config", "/app/configs/gateway.json"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AI_GATEWAY_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: client-key
            - name: AI_GATEWAY_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: metrics-token
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: openai-api-key
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: ai-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
spec:
  type: ClusterIP
  selector:
    app: ai-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
