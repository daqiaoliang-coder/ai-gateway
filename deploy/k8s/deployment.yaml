apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
spec:
  replicas: 1
  # Must exceed the contract drain.timeout so in-flight requests can finish.
  # Keep it aligned with terminationGracePeriodSeconds and the drain timeout.
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: ai-gateway
          image: ghcr.io/daqiaoliang-coder/ai-gateway:latest
          args:
            - "-config"
            - "/app/configs/gateway.json"
            - "-policy"
            - "/app/configs/policy.json"
          lifecycle:
            preStop:
              exec:
                # Gives kubelet time to remove this pod from the Service
                # endpoints before the gateway starts refusing traffic.
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AI_GATEWAY_CLIENT_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: client-key
            - name: AI_GATEWAY_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: metrics-token
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-gateway-secrets
                  key: openai-api-key
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: ai-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
spec:
  type: ClusterIP
  selector:
    app: ai-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
